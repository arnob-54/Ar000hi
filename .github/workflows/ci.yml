name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: pytest
        working-directory: backend
        env:
          DEMO_MODE: "1"
        run: python -m pytest -q

  frontend:
    name: Frontend lint / types / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # The browser suite needs the backend, a production frontend build, seeded
  # accounts and a Chromium binary, so it runs on demand or on a nightly cron
  # rather than gating every push.
  e2e:
    name: Browser e2e
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEMO_MODE: "1"
      DATABASE_PATH: ${{ github.workspace }}/backend/arooohi.ci.db
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Seed e2e accounts
        working-directory: backend
        run: python seed_e2e.py
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start backend and frontend
        run: |
          (cd backend && nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &)
          (cd frontend && nohup npm run start > frontend.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null && \
              curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf http://127.0.0.1:3000/ >/dev/null
      - name: Resolve Chromium path
        working-directory: frontend
        run: echo "HELIUM_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Run browser suite
        env:
          HEADLESS: "1"
        run: node e2e/live-test.js
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/report.json
            e2e/screenshots/
            backend/backend.log
            frontend/frontend.log
          if-no-files-found: ignore
